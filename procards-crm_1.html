<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PROcards Commission CRM</title>
<style>
  :root{
    --navy:#000000;
    --navy-2:#161616;
    --blue:#d4af37;
    --sky:#f0cd6b;
    --bg:#0d0d0e;
    --card:#1a1a1c;
    --line:#3a3529;
    --text:#f2ead4;
    --muted:#b8a76e;
    --green:#4ade80;
    --green-bg:rgba(74,222,128,.14);
    --amber:#f0cd6b;
    --amber-bg:rgba(240,205,107,.14);
    --gray:#a3a3a3;
    --gray-bg:rgba(163,163,163,.14);
    --red:#f87171;
    --red-bg:rgba(248,113,113,.14);
    --radius:12px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
  }
  header.app-header{
    background:linear-gradient(135deg,var(--navy) 0%,var(--navy-2) 100%);
    color:#fff;
    padding:18px 20px;
    display:flex;
    align-items:center;
    gap:14px;
    position:sticky;
    top:0;
    z-index:20;
    box-shadow:0 2px 10px rgba(0,0,0,.15);
  }
  header.app-header img{
    height:40px;
    width:auto;
    border-radius:6px;
    background:#fff;
    padding:4px;
  }
  header.app-header .titles h1{
    margin:0;
    font-size:17px;
    font-weight:700;
    letter-spacing:.2px;
  }
  header.app-header .titles p{
    margin:2px 0 0;
    font-size:12px;
    color:#b9cbe0;
  }
  nav.tabs{
    display:flex;
    gap:6px;
    overflow-x:auto;
    padding:10px 14px;
    background:var(--navy-2);
    position:sticky;
    top:76px;
    z-index:19;
    -webkit-overflow-scrolling:touch;
  }
  nav.tabs::-webkit-scrollbar{height:4px;}
  nav.tabs button{
    flex:none;
    background:rgba(212,175,55,.08);
    color:#d9c690;
    border:1px solid rgba(212,175,55,.25);
    padding:8px 14px;
    border-radius:20px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    white-space:nowrap;
  }
  nav.tabs button.active{
    background:var(--blue);
    color:#0d0d0e;
    border-color:var(--blue);
  }
  nav.tabs button.add-btn{
    background:transparent;
    border:1px dashed rgba(212,175,55,.4);
    color:#d9c690;
  }
  nav.subtabs{
    display:flex;
    gap:6px;
    overflow-x:auto;
    margin-bottom:14px;
  }
  nav.subtabs button{
    flex:none;
    background:var(--card);
    color:var(--muted);
    border:1px solid var(--line);
    padding:8px 14px;
    border-radius:20px;
    font-size:12.5px;
    font-weight:700;
    cursor:pointer;
    white-space:nowrap;
  }
  nav.subtabs button.active{
    background:var(--blue);
    color:#0d0d0e;
    border-color:var(--blue);
  }
  main{
    max-width:1080px;
    margin:0 auto;
    padding:18px 14px 60px;
  }
  .section-title{
    font-size:15px;
    font-weight:700;
    margin:22px 0 10px;
    color:var(--sky);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    flex-wrap:wrap;
  }
  .section-title .hint{font-size:11.5px;font-weight:500;color:var(--muted);}
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px;
    margin-bottom:14px;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:10px;
  }
  .stat{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px;
  }
  .stat .label{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.4px;
    color:var(--muted);
    font-weight:700;
    margin-bottom:6px;
  }
  .stat .value{
    font-size:19px;
    font-weight:800;
    color:var(--text);
  }
  .stat .value.money{color:var(--blue);}
  .stat .value.penalty{color:var(--red);}
  table{
    width:100%;
    border-collapse:collapse;
    font-size:12.5px;
  }
  th{
    text-align:left;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.3px;
    color:var(--muted);
    padding:8px 8px;
    border-bottom:2px solid var(--line);
    white-space:nowrap;
  }
  td{
    padding:9px 8px;
    border-bottom:1px solid var(--line);
    white-space:nowrap;
  }
  tr:last-child td{border-bottom:none;}
  tr.clickable{cursor:pointer;}
  tr.clickable:hover{background:rgba(212,175,55,.06);}
  .table-wrap{overflow-x:auto;}
  .badge{
    display:inline-block;
    padding:3px 9px;
    border-radius:20px;
    font-size:11px;
    font-weight:700;
  }
  .badge-PAID{background:var(--green-bg);color:var(--green);}
  .badge-ONHOLD{background:var(--gray-bg);color:var(--gray);}
  .badge-DNA{background:var(--red-bg);color:var(--red);}
  select.status-select{
    font-size:11.5px;
    font-weight:700;
    padding:4px 6px;
    border-radius:8px;
    border:1px solid var(--line);
  }
  select.status-select.st-PAID{background:var(--green-bg);color:var(--green);}
  select.status-select.st-ONHOLD{background:var(--gray-bg);color:var(--gray);}
  select.status-select.st-DNA{background:var(--red-bg);color:var(--red);}
  .btn{
    background:var(--blue);
    color:#0d0d0e;
    border:none;
    padding:9px 16px;
    border-radius:8px;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
  }
  .btn:hover{background:var(--sky);}
  .btn.secondary{
    background:transparent;
    color:var(--blue);
    border:1px solid var(--blue);
  }
  .btn.danger{background:transparent;color:var(--red);border:1px solid var(--red);}
  .btn.small{padding:5px 10px;font-size:11.5px;border-radius:6px;}
  .btn.full{width:100%;}
  form.form-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:10px;
    align-items:end;
  }
  label{
    font-size:11.5px;
    font-weight:700;
    color:var(--muted);
    display:block;
    margin-bottom:4px;
  }
  input[type=text],input[type=number],input[type=date],input[type=month],select{
    width:100%;
    padding:9px 10px;
    border:1px solid var(--line);
    border-radius:8px;
    font-size:13px;
    background:#232320;
    color:var(--text);
  }
  input:focus,select:focus{outline:2px solid var(--sky);outline-offset:1px;}
  .empty{
    text-align:center;
    color:var(--muted);
    font-size:12.5px;
    padding:22px 10px;
  }
  .modal-overlay{
    position:fixed;inset:0;background:rgba(10,20,35,.5);
    display:flex;align-items:flex-end;justify-content:center;
    z-index:50;
    overflow-y:auto;
    padding:10px 0;
  }
  .modal{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px 16px 0 0;
    padding:18px;
    width:100%;
    max-width:520px;
    max-height:90vh;
    overflow-y:auto;
    color:var(--text);
  }
  @media(min-width:600px){
    .modal-overlay{align-items:center;}
    .modal{border-radius:16px;}
  }
  .modal h3{margin:0 0 12px;font-size:16px;color:var(--sky);}
  .modal-actions{display:flex;gap:8px;margin-top:14px;}
  .row{display:flex;gap:8px;align-items:center;}
  .top3-item{
    display:flex;align-items:center;gap:10px;
    padding:10px 0;border-bottom:1px solid var(--line);
  }
  .top3-item:last-child{border-bottom:none;}
  .top3-rank{
    width:26px;height:26px;border-radius:50%;
    background:var(--blue);color:#0d0d0e;
    display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:800;flex:none;
  }
  .top3-item:nth-child(1) .top3-rank{background:#f0cd6b;}
  .top3-item:nth-child(2) .top3-rank{background:#c9c9c9;}
  .top3-item:nth-child(3) .top3-rank{background:#8a5a3b;}
  .top3-info{flex:1;}
  .top3-info .n{font-weight:700;font-size:13px;color:var(--text);}
  .top3-info .c{font-size:12px;color:var(--muted);}
  .top3-amt{font-weight:800;color:var(--blue);font-size:13.5px;}
  .filters{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
    gap:8px;
    margin-bottom:12px;
  }
  .muted{color:var(--muted);}
  .rate-row{
    display:grid;
    grid-template-columns:1.6fr 1fr 1fr 32px;
    gap:8px;
    align-items:center;
    padding:6px 0;
    border-bottom:1px solid var(--line);
    font-size:12.5px;
  }
  .rate-row:last-child{border-bottom:none;}
  .rate-row input{padding:6px 8px;font-size:12.5px;}
  .rate-head{
    display:grid;
    grid-template-columns:1.6fr 1fr 1fr 32px;
    gap:8px;
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:.3px;
    color:var(--muted);
    font-weight:700;
    padding-bottom:6px;
  }
  .accordion-head{
    display:flex;justify-content:space-between;align-items:center;
    padding:12px 4px;cursor:pointer;font-weight:700;color:var(--sky);font-size:13.5px;
  }
  .icon-btn{
    background:none;border:none;cursor:pointer;color:var(--muted);
    font-size:14px;padding:2px 6px;
  }
  .icon-btn:hover{color:var(--red);}
  .back-link{
    background:none;border:none;color:var(--blue);font-size:12.5px;font-weight:700;
    cursor:pointer;padding:0 0 10px;
  }
  footer.save-note{
    text-align:center;color:var(--muted);font-size:11px;padding:16px 0 4px;
  }
</style>
</head>
<body>
  <header class="app-header">
    <div class="titles">
      <h1>PROcards Commission CRM</h1>
      <p id="header-date"></p>
    </div>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <main id="main"></main>
  <footer class="save-note" id="save-note"></footer>
  <div id="modal-root"></div>

<script>

/* ---------------- Utilities ---------------- */
const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
const peso = (n) => {
  n = Number(n)||0;
  return n.toLocaleString('en-PH',{style:'currency',currency:'PHP',maximumFractionDigits:0});
};
const escapeHtml = (s='') => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const todayStr = () => new Date().toISOString().slice(0,10);
const curMonthStr = () => new Date().toISOString().slice(0,7);
const monthLabelFromStr = (ym) => {
  const [y,m] = ym.split('-').map(Number);
  return new Date(y, m-1, 1).toLocaleDateString('en-US',{month:'long',year:'numeric'});
};
const STATUSES = ['PAID','ONHOLD','DNA'];
const STATUS_LABEL = { PAID:'Paid', ONHOLD:'On Hold', DNA:'DNA' };
const BANK_PREFIXES = ['MTB Non-QR','MTB-QR','MTB','RCBC','BPI','BOC'];

function bankFromCardType(agencyName, cardTypeName){
  for(const p of BANK_PREFIXES){
    if(cardTypeName.startsWith(p)) return p.replace(' Non-QR','').replace('-QR','');
  }
  return agencyName;
}

/* ---------------- Default State ---------------- */
function defaultState(){
  return {
    settings: { dnaRate: 10000 },
    ui: {
      activeTab: 'admin',
      mainMonth: curMonthStr(),
      recordsAgent: 'all', recordsFrom: '', recordsTo: '',
      agencySection: {}, // agencyId -> 'portal'|'tracker'|'report'
      agencyMonth: {},   // agencyId -> 'YYYY-MM' for tracker
      agencyReportMode: {}, // agencyId -> 'weekly'|'monthly'
      selectedAgent: {}, // agencyId -> agent name or null (portal drilldown)
      mainSelectedAgent: null, // agent name selected in ProCards main Agent Portal
      ratesOpen: {}, // agencyId -> bool, accordion state in rates manager
      reportSelectedAgent: null // agent id selected in the top-level Agent Portal tab
    },
    agents: [],
    agencies: [
      { id:'procards', name:'ProCards', overview:true },
      { id:'unionbank', name:'Unionbank',
        cardTypes:[ {id:'ub-fixed', name:'Fixed', range:'', umRate:1500, agentRate:1000} ],
        entries:[] },
      { id:'orc', name:'ORC Mktg Srvcs.',
        cardTypes:[
          {id:'orc-classic', name:'Classic', range:'\u20b150,000-below', umRate:2150, agentRate:1800},
          {id:'orc-gold', name:'Gold', range:'\u20b151,000-\u20b1299,000', umRate:2600, agentRate:2200},
          {id:'orc-platinum', name:'Platinum', range:'\u20b1300,000-Up', umRate:3500, agentRate:2800}
        ],
        entries:[] },
      { id:'ecr', name:'ECR',
        cardTypes:[
          {id:'ecr-mtbnqg', name:'MTB Non-QR Gold', range:'', umRate:2150, agentRate:1500},
          {id:'ecr-mtbnqp', name:'MTB Non-QR Plat', range:'', umRate:3150, agentRate:2500},
          {id:'ecr-mtbqg', name:'MTB-QR Gold', range:'', umRate:3050, agentRate:2400},
          {id:'ecr-mtbqp', name:'MTB-QR Plat', range:'', umRate:4050, agentRate:3400},
          {id:'ecr-rcbcc', name:'RCBC Classic', range:'', umRate:800, agentRate:600},
          {id:'ecr-rcbcg', name:'RCBC Gold', range:'', umRate:1700, agentRate:1300},
          {id:'ecr-rcbcp', name:'RCBC Plat', range:'', umRate:2700, agentRate:2400},
          {id:'ecr-rcbci', name:'RCBC Infinite', range:'', umRate:3200, agentRate:3000},
          {id:'ecr-bpif', name:'BPI Fixed', range:'', umRate:2100, agentRate:1700},
          {id:'ecr-bocg', name:'BOC Gold', range:'', umRate:1500, agentRate:1000},
          {id:'ecr-bocc', name:'BOC Classic', range:'', umRate:1100, agentRate:700},
          {id:'ecr-bocp', name:'BOC Plat', range:'', umRate:2000, agentRate:1500}
        ],
        entries:[] }
    ]
  };
}

let state = defaultState();
let saveTimer = null;
let unlocked = false; // in-memory only, not persisted; resets on reload
const APP_PIN = '041026';

const SUPABASE_URL = 'https://djffchbmdvclzcfvoyhi.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable__zMWLW4AsgYkDMFJGZH_Sg_2apYlo-i';
const STORAGE_KEY = 'procards-crm-state';

async function sbGet(key){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/crm_data?key=eq.${encodeURIComponent(key)}&select=value`, {
    headers: {
      'apikey': SUPABASE_ANON_KEY,
      'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
    }
  });
  if(!res.ok) throw new Error(`HTTP ${res.status}: ${await res.text()}`);
  const rows = await res.json();
  return rows.length ? rows[0].value : null;
}

async function sbSet(key, value){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/crm_data`, {
    method: 'POST',
    headers: {
      'apikey': SUPABASE_ANON_KEY,
      'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
      'Content-Type': 'application/json',
      'Prefer': 'resolution=merge-duplicates'
    },
    body: JSON.stringify([{ key, value, updated_at: new Date().toISOString() }])
  });
  if(!res.ok) throw new Error(`HTTP ${res.status}: ${await res.text()}`);
}

/* ---------------- Persistence ---------------- */
async function loadState(){
  try{
    const value = await sbGet(STORAGE_KEY);
    if(value){
      const parsed = value;
      state = Object.assign(defaultState(), parsed);
      state.ui = Object.assign(defaultState().ui, parsed.ui||{});
      if(!state.settings) state.settings = {dnaRate:10000};
      if(!state.agents) state.agents = [];
    }
  }catch(e){ console.error('Load failed:', e); document.getElementById('save-note').textContent = 'Load error: ' + (e.message||JSON.stringify(e)); }
  renderAll();
}

function saveState(){
  document.getElementById('save-note').textContent = 'Saving...';
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try{
      await sbSet(STORAGE_KEY, state);
      document.getElementById('save-note').textContent = 'All changes saved \u00b7 ' + new Date().toLocaleTimeString('en-PH',{hour:'2-digit',minute:'2-digit'});
    }catch(e){
      console.error('Save failed:', e);
      document.getElementById('save-note').textContent = 'Save error: ' + (e.message || JSON.stringify(e));
    }
  }, 250);
}

function update(mutator){
  mutator(state);
  saveState();
  renderAll();
}

/* ---------------- Data Helpers ---------------- */
function getAgency(id){ return state.agencies.find(a=>a.id===id); }
function nonOverviewAgencies(){ return state.agencies.filter(a=>!a.overview); }
function findCardType(agency, ctId){ return agency.cardTypes.find(c=>c.id===ctId); }
function getAgentName(agentId){ const a = state.agents.find(x=>x.id===agentId); return a?a.name:'\u2014'; }

function computeEntryFigures(entry){
  const agencyCommission = Number(entry.umRate)||0; // gross UM rate captured at entry time
  const agentBase = Number(entry.agentRate)||0;
  const umCommission = agencyCommission - agentBase;
  let dnaDeducted = 0;
  let agentFinal = agentBase;
  if(entry.status === 'DNA'){
    dnaDeducted = Number(state.settings.dnaRate)||0;
    agentFinal = agentBase - dnaDeducted;
  }
  return { agencyCommission, agentBase, agentFinal, umCommission, dnaDeducted };
}

function allEntriesFlat(){
  let list = [];
  nonOverviewAgencies().forEach(ag=>{
    ag.entries.forEach(e=>{
      const f = computeEntryFigures(e);
      const ct = findCardType(ag, e.cardTypeId);
      list.push({
        ...e,
        agencyId: ag.id, agencyName: ag.name,
        cardTypeName: ct?ct.name:(e.cardTypeNameSnapshot||'\u2014'),
        agentName: getAgentName(e.agentId),
        bankName: bankFromCardType(ag.name, ct?ct.name:(e.cardTypeNameSnapshot||'')),
        ...f
      });
    });
  });
  return list;
}

function inDateRange(dateStr, from, to){
  if(from && dateStr < from) return false;
  if(to && dateStr > to) return false;
  return true;
}

function weekKey(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  const jan1 = new Date(d.getFullYear(),0,1);
  const days = Math.floor((d - jan1)/86400000);
  const week = Math.ceil((days + jan1.getDay() + 1)/7);
  return d.getFullYear()+'-W'+String(week).padStart(2,'0');
}


/* ---------------- Render dispatch ---------------- */
function renderAll(){
  document.getElementById('header-date').textContent = monthLabelFromStr(curMonthStr());
  renderTabs();
  renderMain();
}

function renderTabs(){
  const tabsEl = document.getElementById('tabs');
  let html = '';
  html += `<button class="${state.ui.activeTab==='admin'?'active':''}" onclick="setTab('admin')">\ud83d\udcdd Admin</button>`;
  html += `<button class="${state.ui.activeTab==='agentportal'?'active':''}" onclick="setTab('agentportal')">${unlocked?'':'\ud83d\udd12 '}Agent Portal</button>`;
  state.agencies.forEach(a=>{
    const lockIcon = unlocked ? (a.overview?'\u2b50 ':'') : '\ud83d\udd12 ';
    html += `<button class="${state.ui.activeTab===a.id?'active':''}" onclick="setTab('${a.id}')">${lockIcon}${escapeHtml(a.name)}</button>`;
  });
  if(unlocked){
    html += `<button class="add-btn" onclick="openAddAgencyModal()">+ Add Agency</button>`;
  }
  html += `<button class="${state.ui.activeTab==='settings'?'active':''}" onclick="setTab('settings')">${unlocked?'\u2699\ufe0f':'\ud83d\udd12'} Settings${getArchivableYears().length?' \ud83d\udd34':''}</button>`;
  tabsEl.innerHTML = html;
}

function setTab(id){
  state.ui.activeTab = id;
  renderAll();
}

function renderMain(){
  const el = document.getElementById('main');
  const tab = state.ui.activeTab;
  if(tab === 'admin'){ el.innerHTML = renderAdminTab(); return; }
  if(!unlocked){ el.innerHTML = renderLockScreen(); return; }
  if(tab === 'settings'){ el.innerHTML = renderSettingsTab(); return; }
  if(tab === 'agentportal'){ el.innerHTML = renderAgentPortalTab(); return; }
  const agency = getAgency(tab);
  if(!agency){ el.innerHTML = '<div class="empty">Agency not found.</div>'; return; }
  if(agency.overview){ el.innerHTML = renderMainTab(agency); return; }
  el.innerHTML = renderAgencyTab(agency);
}

/* ---------------- PIN Lock ---------------- */
function renderLockScreen(){
  return `
    <div class="card" style="max-width:360px;margin:40px auto;text-align:center;">
      <div style="font-size:32px;margin-bottom:6px;">\ud83d\udd12</div>
      <div style="font-weight:800;color:var(--sky);font-size:15px;margin-bottom:4px;">This section is protected</div>
      <div class="muted" style="font-size:12px;margin-bottom:16px;">Enter the PIN to view commission data.</div>
      <form onsubmit="submitPin(event)">
        <input type="password" inputmode="numeric" id="pin-input" placeholder="Enter PIN" autocomplete="off" style="text-align:center;letter-spacing:3px;font-size:16px;">
        <button type="submit" class="btn full" style="margin-top:10px;">Unlock</button>
      </form>
    </div>
  `;
}

function submitPin(ev){
  ev.preventDefault();
  const val = document.getElementById('pin-input').value.trim();
  if(val === APP_PIN){
    unlocked = true;
    renderAll();
  } else {
    alert('Incorrect PIN.');
  }
}


/* ---------------- ProCards Main Tab ---------------- */
function renderMainTab(agency){
  const ui = state.ui;
  const month = ui.mainMonth || curMonthStr();
  const all = allEntriesFlat();
  const monthEntries = all.filter(e => e.date.slice(0,7) === month);

  const totalTeamCommission = monthEntries.reduce((s,e)=>s+e.agencyCommission,0); // A
  const totalReleased = monthEntries.reduce((s,e)=>s+e.agentFinal,0); // B
  const umCommission = totalTeamCommission - totalReleased;

  const byAgent = {};
  monthEntries.forEach(e=>{
    byAgent[e.agentName] = (byAgent[e.agentName]||0) + e.agentFinal;
  });
  const top3 = Object.entries(byAgent).sort((a,b)=>b[1]-a[1]).slice(0,3);

  // filtered records table (independent of month filter, uses its own agent/date filters)
  let records = all.slice();
  if(ui.recordsAgent !== 'all') records = records.filter(e=>e.agentName === ui.recordsAgent);
  records = records.filter(e => inDateRange(e.date, ui.recordsFrom, ui.recordsTo));
  records.sort((a,b)=>b.date.localeCompare(a.date));

  return `

      <div class="stat"><div class="label">B \u00b7 Total Released Commission to Agent</div><div class="value money">${peso(totalReleased)}</div></div>
      <div class="stat"><div class="label">Unit Manager Commission (A \u2212 B)</div><div class="value money">${peso(umCommission)}</div></div>
    </div>

    <div class="section-title">Top 3 Agents <span class="hint">by commission released, ${monthLabelFromStr(month)}</span></div>
    <div class="card">
      ${top3.length ? top3.map(([name,amt],i)=>`
        <div class="top3-item">
          <div class="top3-rank">${i+1}</div>
          <div class="top3-info"><div class="n">${escapeHtml(name)}</div><div class="c">Commission released this month</div></div>
          <div class="top3-amt">${peso(amt)}</div>
        </div>
      `).join('') : '<div class="empty">No approvals recorded yet this month.</div>'}
    </div>

    <div class="section-title">
      Client Records
      <span class="row">
        <button class="btn small secondary" onclick="openAddAgentModal()">+ Add Agent</button>
        <button class="btn small" onclick="openAddClientModal()">+ Add Client</button>
      </span>
    </div>
    <div class="card">
      <div class="filters">
        <div>
          <label>Agent</label>
          <select onchange="setUiVal('recordsAgent', this.value)">
            <option value="all" ${ui.recordsAgent==='all'?'selected':''}>All Agents</option>
            ${state.agents.map(a=>`<option value="${escapeHtml(a.name)}" ${ui.recordsAgent===a.name?'selected':''}>${escapeHtml(a.name)}</option>`).join('')}
          </select>
        </div>
        <div><label>From</label><input type="date" value="${ui.recordsFrom}" onchange="setUiVal('recordsFrom', this.value)"></div>
        <div><label>To</label><input type="date" value="${ui.recordsTo}" onchange="setUiVal('recordsTo', this.value)"></div>
      </div>
    </div>
    <div class="card table-wrap">
      ${records.length ? `
      <table>
        <thead><tr>
          <th>Date</th><th>Client</th><th>Agency</th><th>Card Type</th>
          <th>UM Rate</th><th>Agent</th><th>Agent Comm.</th><th>Status</th><th></th>
        </tr></thead>
        <tbody>
        ${records.map(e=>`
          <tr>
            <td>${e.date}</td>
            <td>${escapeHtml(e.clientName)}</td>
            <td>${escapeHtml(e.agencyName)}</td>
            <td>${escapeHtml(e.cardTypeName)}</td>
            <td>${peso(e.agencyCommission)}</td>
            <td>${escapeHtml(e.agentName)}</td>
            <td>${peso(e.agentFinal)}</td>
            <td><select class="status-select st-${e.status}" onchange="updateEntryStatus('${e.agencyId}','${e.id}', this.value)">
              ${STATUSES.map(s=>`<option value="${s}" ${s===e.status?'selected':''}>${STATUS_LABEL[s]}</option>`).join('')}
            </select></td>
            <td><button class="icon-btn" onclick="removeEntry('${e.agencyId}','${e.id}')">\u2716</button></td>
          </tr>
        `).join('')}
        </tbody>
      </table>` : '<div class="empty">No client records match these filters.</div>'}
    </div>

    ${renderMainAgentPortal(all)}

    <div class="section-title">Commission Rates <span class="hint">Editable by card type</span></div>
    ${nonOverviewAgencies().map(ag => renderRatesAccordion(ag)).join('')}
  `;
}

function renderMainAgentPortal(all){
  const selected = state.ui.mainSelectedAgent;

  // rank all agents by all-time total commission earned, across all agencies
  const byAgent = {};
  all.forEach(e=>{
    if(!byAgent[e.agentName]) byAgent[e.agentName] = { count:0, total:0 };
    byAgent[e.agentName].count++;
    byAgent[e.agentName].total += e.agentFinal;
  });
  const ranked = Object.entries(byAgent).sort((a,b)=>b[1].total-a[1].total);

  if(selected){
    const agentEntries = all.filter(e=>e.agentName===selected).sort((a,b)=>b.date.localeCompare(a.date));

/* ---- Commission Tracker ---- */
function renderCommissionTracker(agency){
  const month = state.ui.agencyMonth[agency.id] || curMonthStr();
  const entries = agency.entries
    .map(e=>({ ...e, ...computeEntryFigures(e) }))
    .filter(e=>e.date.slice(0,7)===month);

  const totalAgencyCommission = entries.reduce((s,e)=>s+e.agencyCommission,0);
  const totalAgentReleased = entries.reduce((s,e)=>s+e.agentFinal,0);
  const umCommission = totalAgencyCommission - totalAgentReleased;
  const penalty = entries.reduce((s,e)=>s+e.dnaDeducted,0);

  return `
    <div class="section-title">
      Commission Tracker

      <div class="stat"><div class="label">Approvals</div><div class="value">${entries.length}</div></div>
      <div class="stat"><div class="label">Total Agency Commission</div><div class="value money">${peso(totalAgencyCommission)}</div></div>
      <div class="stat"><div class="label">Total Agent Commission Released</div><div class="value money">${peso(totalAgentReleased)}</div></div>
      <div class="stat"><div class="label">Unit Manager Commission</div><div class="value money">${peso(umCommission)}</div></div>
      <div class="stat"><div class="label">Penalty (DNA)</div><div class="value penalty">${peso(penalty)}</div></div>
    </div>
  `;
}

function setAgencyMonth(agencyId, val){

  renderMain();
}

/* ---- Sales Report ---- */
function renderSalesReport(agency){
  const mode = state.ui.agencyReportMode[agency.id] || 'monthly';
  const entries = agency.entries.map(e=>{
    const ct = findCardType(agency, e.cardTypeId);
    return { ...e, ...computeEntryFigures(e), cardTypeName: ct?ct.name:(e.cardTypeNameSnapshot||'\u2014') };
  });

  const groups = {};
  entries.forEach(e=>{
    const key = mode==='weekly' ? weekKey(e.date) : e.date.slice(0,7);
    if(!groups[key]) groups[key] = { count:0, agencyTotal:0, agentTotal:0, umTotal:0 };
    groups[key].count++;
    groups[key].agencyTotal += e.agencyCommission;
    groups[key].agentTotal += e.agentFinal;
    groups[key].umTotal += e.umCommission;
  });
  const rows = Object.entries(groups).sort((a,b)=>b[0].localeCompare(a[0]));

  const byCardType = {};
  entries.forEach(e=>{
    if(!byCardType[e.cardTypeName]) byCardType[e.cardTypeName] = { count:0, agencyTotal:0, agentTotal:0 };
    byCardType[e.cardTypeName].count++;
    byCardType[e.cardTypeName].agencyTotal += e.agencyCommission;
    byCardType[e.cardTypeName].agentTotal += e.agentFinal;
  });
  const cardTypeRows = Object.entries(byCardType).sort((a,b)=>b[1].count-a[1].count);

  return `
    <div class="section-title">
      Sales Report
      <span class="row">
        <button class="btn small ${mode==='weekly'?'':'secondary'}" onclick="setReportMode('${agency.id}','weekly')">Weekly</button>
        <button class="btn small ${mode==='monthly'?'':'secondary'}" onclick="setReportMode('${agency.id}','monthly')">Monthly</button>
      </span>
    </div>
    <div class="card table-wrap">
      ${rows.length ? `
      <table>
        <thead><tr><th>${mode==='weekly'?'Week':'Month'}</th><th>Approvals</th><th>Agency Commission</th><th>Agent Commission Released</th><th>UM Commission</th></tr></thead>
        <tbody>
        ${rows.map(([k,v])=>`
          <tr>
            <td>${mode==='weekly'?escapeHtml(k):escapeHtml(monthLabelFromStr(k))}</td>
            <td>${v.count}</td>
            <td>${peso(v.agencyTotal)}</td>
            <td>${peso(v.agentTotal)}</td>
            <td>${peso(v.umTotal)}</td>
          </tr>
        `).join('')}
        </tbody>
      </table>` : '<div class="empty">No records yet to report on.</div>'}
    </div>

    <div class="section-title">Card Type Summary <span class="hint">Quantity approved & commission</span></div>
    <div class="card table-wrap">
      ${cardTypeRows.length ? `
      <table>
        <thead><tr><th>Card Type</th><th>Quantity</th><th>Agency Commission</th><th>Agent Commission Released</th></tr></thead>
        <tbody>
        ${cardTypeRows.map(([name,v])=>`
          <tr>
            <td>${escapeHtml(name)}</td>
            <td>${v.count}</td>
            <td>${peso(v.agencyTotal)}</td>
            <td>${peso(v.agentTotal)}</td>
          </tr>
        `).join('')}
        </tbody>
      </table>` : '<div class="empty">No records yet to report on.</div>'}
    </div>
  `;
}

function setReportMode(agencyId, mode){
  state.ui.agencyReportMode[agencyId] = mode;
  renderMain();
}

/* ---- Entry status / removal ---- */
function updateEntryStatus(agencyId, entryId, status){
  update(s=>{
    const ag = getAgency(agencyId);
    const e = ag.entries.find(x=>x.id===entryId);
    if(e) e.status = status;
  });
}

function removeEntry(agencyId, entryId){
  if(!confirm('Remove this client record?')) return;
  update(s=>{
    const ag = getAgency(agencyId);
    ag.entries = ag.entries.filter(x=>x.id!==entryId);
  });
}

function removeCardType(agencyId, ctId){
  const ag = getAgency(agencyId);
  const inUse = ag.entries.some(e=>e.cardTypeId===ctId);
  if(inUse){ alert('This card type is used in existing client records. Remove or reassign those records first.'); return; }
  if(!confirm('Remove this card type?')) return;
  update(s=>{
    ag.cardTypes = ag.cardTypes.filter(c=>c.id!==ctId);
  });
}

function submitAddClient(ev){
  ev.preventDefault();
  const fd = new FormData(ev.target);
  const agencyId = fd.get('agencyId');
  let agentId = fd.get('agentId');

  update(s=>{
    if(agentId === '__new__'){
      const name = (document.getElementById('ac-newagent-name').value||'').trim();
      if(!name){ alert('Enter a name for the new agent.'); return; }
      const newAgent = { id:'agent-'+uid(), name, pin:'' };
      s.agents.push(newAgent);
      agentId = newAgent.id;
    }
    const ag = getAgency(agencyId);
    const ct = findCardType(ag, fd.get('cardTypeId'));
    ag.entries.push({
      id: uid(),
      clientName: fd.get('clientName').trim(),
      date: fd.get('date'),
      cardTypeId: fd.get('cardTypeId'),
      cardTypeNameSnapshot: ct?ct.name:'',
      agentId,
      umRate: Number(fd.get('umRate'))||0,
      agentRate: Number(fd.get('agentRate'))||0,
      status: 'ONHOLD',
      source: 'main'
    });
  });
  closeModal();
}

/* ---------------- Year-End Archive & Purge ---------------- */
function getEntryYear(dateStr){ return dateStr ? dateStr.slice(0,4) : ''; }

function getArchivableYears(){
  const years = new Set();
  const cy = String(new Date().getFullYear());
  nonOverviewAgencies().forEach(ag=>{
    (ag.entries||[]).forEach(e=>{
      const y = getEntryYear(e.date);
      if(y && y < cy) years.add(y);
    });
  });
  return Array.from(years).sort();
}

function downloadBlob(content, filename, mime){
  const blob = new Blob([content], {type:mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function archiveAndPurgeYears(){
  const years = getArchivableYears();
  if(!years.length){ alert('No past-year records to archive.'); return; }
  const rows = allEntriesFlat().filter(e => years.includes(getEntryYear(e.date)));
  if(!rows.length){ alert('No past-year records to archive.'); return; }
  const yearLabel = years.join(', ');
  if(!confirm(`This will download a full backup of ${rows.length} record(s) from ${yearLabel}, then PERMANENTLY delete them from the live system. This cannot be undone. Continue?`)) return;
  if(!confirm(`Are you sure? Type OK on the next prompt only if you have saved the downloaded files.`)) return;

  const csvRows = [['Agency','Agent','Client Name','Date Approved','Card Type','Status','Agency Commission','Agent Commission','DNA Deducted']];
  rows.forEach(e=>{
    csvRows.push([e.agencyName, e.agentName, e.clientName, e.date, e.cardTypeName, e.status, e.agencyCommission, e.agentFinal, e.dnaDeducted]);
  });
  const csv = csvRows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  downloadBlob(csv, `procards-archive-${years.join('_')}-${todayStr()}.csv`, 'text/csv;charset=utf-8;');
  downloadBlob(JSON.stringify(rows, null, 2), `procards-archive-${years.join('_')}-${todayStr()}.json`, 'application/json');

  update(s=>{
    s.agencies.forEach(ag=>{
      if(ag.overview) return;
      ag.entries = (ag.entries||[]).filter(e => !years.includes(getEntryYear(e.date)));
    });
    if(!s.settings.archivedYears) s.settings.archivedYears = [];
    years.forEach(y=>{ if(!s.settings.archivedYears.includes(y)) s.settings.archivedYears.push(y); });
  });

  alert(`Archived and deleted ${rows.length} record(s) from ${yearLabel}. Backup files were downloaded to your device \u2014 keep them somewhere safe.`);
}

function renderArchiveSection(){
  const years = getArchivableYears();
  const cy = new Date().getFullYear();
  return `
    <div class="section-title">Year-End Archive & Purge</div>
    <div class="card">
      <p class="muted" style="font-size:12.5px;margin:0 0 10px;">Downloads a full backup (CSV + JSON) of past-year records, then permanently deletes them from the live system. Records from ${cy} are never touched.</p>
      ${years.length ? `
        <p style="font-size:12.5px;margin:0 0 10px;">Unarchived records found for: <strong>${years.join(', ')}</strong></p>
        <button class="btn danger" onclick="archiveAndPurgeYears()">Export & Purge ${years.join(', ')} Records</button>
      ` : `<p class="muted" style="font-size:12.5px;">Nothing pending \u2014 all records are from the current year (${cy}).</p>`}
    </div>
  `;
}

function updateAgentPin(agentId, val){
  const pin = val.trim();
  if(pin && state.agents.some(a=>a.id!==agentId && a.pin===pin)){
    alert('This PIN is already assigned to another agent. Choose a different PIN.');
    renderMain();
    return;
  }
  update(s=>{
    const a = s.agents.find(x=>x.id===agentId);
    if(a) a.pin = pin;
  });
}

function removeAgentGlobal(agentId){
  const inUse = nonOverviewAgencies().some(ag=>ag.entries.some(e=>e.agentId===agentId));
  if(inUse){ alert('This agent has existing client records. Remove those records first.'); return; }
  if(!confirm('Remove this agent?')) return;
  update(s=>{ s.agents = s.agents.filter(a=>a.id!==agentId); });
}

function exportData(){
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'procards-crm-backup-' + todayStr() + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function importData(ev){
  const file = ev.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const parsed = JSON.parse(e.target.result);
      if(!parsed.agencies || !parsed.agents){ alert('This file does not look like a valid backup.'); return; }
      if(!confirm('This will replace all current data with the backup file. Continue?')) return;
      update(s=>{
        Object.keys(s).forEach(k=>delete s[k]);
        const merged = Object.assign(defaultState(), parsed);
        merged.ui = Object.assign(defaultState().ui, parsed.ui||{});
        Object.assign(s, merged);
      });
      alert('Backup restored successfully.');
    }catch(err){
      alert('Could not read this file. Make sure it is a valid backup .json file.');
    }
  };
  reader.readAsText(file);
  ev.target.value = '';
}

function resetAllData(){
  if(!confirm('This will permanently delete all agencies, agents, and client records. Continue?')) return;
  update(s=>{
    const fresh = defaultState();
    Object.keys(s).forEach(k=>delete s[k]);
    Object.assign(s, fresh);
  });
}

/* ---------------- Init ---------------- */
loadState();

</script>
